[files]
# Include repository-owned dot directories such as .github and .config, but not
# Git's binary object database.
ignore-hidden = false

# English source strings live in en.yml; checking translated values as English
# produces false positives and repeats every source key across all catalogs.
extend-exclude = [
  ".git",
  "crates/roadie-ui/locales/*.yml",
  "!crates/roadie-ui/locales/en.yml",
  "docs/README.*.md",
  ".github/scripts/i18n/merge_crowdin_download.py",
]

[default]
extend-ignore-identifiers-re = ["^(?:ALS|AlsAutomatic|AlsSaturated)$"]

[default.extend-identifiers]
# Protocol and domain identifiers whose source spelling must stay exact.
# `ACI` is Ancor Communications, the PNP manufacturer code ASUS ships its
# monitors under. It is data from the displays themselves, not an abbreviation
# we chose, so it cannot be spelled any other way.
ACI = "ACI"
# Plug and Play, capitalised as Microsoft spells it. This is the literal text
# `dxva2` puts in a monitor's description ("Generic PnP Monitor"), so quoting it
# any other way would quote something Windows does not say.
PnP = "PnP"
PNGs = "PNGs"
SWCustomHighligt2 = "SWCustomHighligt2"
udid = "udid"

[default.extend-words]
# Technical terms and prefixes accepted in prose and compound identifiers.
lod = "lod"
mis = "mis"
scap = "scap"
unparseable = "unparseable"
