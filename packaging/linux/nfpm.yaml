# nfpm package descriptor for OpenRoadie Linux packages (.deb / .rpm / .pkg.tar.zst).
#
# Build with the xtask:
#   cargo run -p xtask -- linux package
#
# Or directly (requires nfpm in PATH; set VERSION and PKG_ARCH):
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager deb --target target/release
#   VERSION=0.6.0 PKG_ARCH=arm64 nfpm package --packager rpm --target target/release
#   VERSION=0.6.0 PKG_ARCH=amd64 nfpm package --packager archlinux --target target/release

name: roadie
version: "${VERSION}"
arch: "${PKG_ARCH}"
maintainer: AprilNEA <dev@aprilnea.me>
description: |-
  Logitech HID++ device control — remap buttons, DPI, and SmartShift.
  An open-source, local-first alternative to Logi Options+. No account,
  no telemetry; configuration lives in a plain TOML file.
homepage: https://github.com/AprilNEA/OpenLogi
license: Apache-2.0 OR MIT

contents:
  # ── binaries ────────────────────────────────────────────────────────────────
  - src: target/release/roadie
    dst: /usr/bin/roadie
    file_info:
      mode: 0755

  - src: target/release/roadie-desktop
    dst: /usr/bin/roadie-desktop
    file_info:
      mode: 0755

  - src: target/release/roadie-overlay
    dst: /usr/bin/roadie-overlay
    file_info:
      mode: 0755

  - src: target/release/roadie-agent
    dst: /usr/bin/roadie-agent
    file_info:
      mode: 0755

  # ── udev rules ──────────────────────────────────────────────────────────────
  - src: packaging/linux/udev/70-roadie.rules
    dst: /etc/udev/rules.d/70-roadie.rules
    file_info:
      mode: 0644

  # ── systemd user unit ───────────────────────────────────────────────────────
  - src: packaging/linux/systemd/roadie-agent.service
    dst: /usr/lib/systemd/user/roadie-agent.service
    file_info:
      mode: 0644

  # ── XDG desktop entry ───────────────────────────────────────────────────────
  - src: packaging/linux/desktop/roadie.desktop
    dst: /usr/share/applications/roadie.desktop
    file_info:
      mode: 0644

  # ── icon ────────────────────────────────────────────────────────────────────
  # Every standard indexed hicolor size, not just the 1024 master: a stock
  # `hicolor/index.theme` stops at 512x512, so a launcher that resolves icons
  # by theme index (KDE's kbuildsycoca, most GTK launchers) finds nothing at
  # all when only `1024x1024/apps` is installed.
  - src: design/icon/roadie.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/roadie.png
    file_info:
      mode: 0644
  - src: design/icon/roadie-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/roadie.png
    file_info:
      mode: 0644
  - src: design/icon/roadie-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/roadie.png
    file_info:
      mode: 0644
  - src: design/icon/roadie-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/roadie.png
    file_info:
      mode: 0644
  - src: design/icon/roadie-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/roadie.png
    file_info:
      mode: 0644
  - src: design/icon/roadie-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/roadie.png
    file_info:
      mode: 0644
  - src: design/icon/roadie-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/roadie.png
    file_info:
      mode: 0644
  - src: design/icon/roadie-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/roadie.png
    file_info:
      mode: 0644

  - src: LICENSE-APACHE
    dst: /usr/share/licenses/roadie/LICENSE-APACHE
    file_info:
      mode: 0644

  - src: LICENSE-MIT
    dst: /usr/share/licenses/roadie/LICENSE-MIT
    file_info:
      mode: 0644

archlinux:
  packager: "AprilNEA <dev@aprilnea.me>"

overrides:
  archlinux:
    depends:
      - dbus
      - fontconfig
      - gcc-libs
      - glibc
      - libglvnd
      - libxcb
      - libxkbcommon
      - libxkbcommon-x11
      - vulkan-icd-loader
      - wayland

scripts:
  postinstall: packaging/linux/nfpm-scripts/postinstall.sh
  postremove: packaging/linux/nfpm-scripts/postremove.sh
