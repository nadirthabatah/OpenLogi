[package]
name = "openlogi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Implementation library for the OpenLogi CLI (the `openlogi` binary)."
keywords = ["logitech", "hidpp", "hid", "mouse", "cli"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
openlogi-core = { path = "../openlogi-core", version = "0.8.1" }
openlogi-hid = { path = "../openlogi-hid", version = "0.8.1" }
openlogi-streamdeck = { path = "../openlogi-streamdeck", version = "0.8.1" }
openlogi-camera = { path = "../openlogi-camera", version = "0.8.1" }
openlogi-assets = { path = "../openlogi-assets", version = "0.8.1" }
openlogi-ipc = { path = "../openlogi-ipc", version = "0.8.1" }
tarpc = { workspace = true }
png = "0.17"
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "io-std", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
