[package]
name = "openlogi-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "What this build knows about a peripheral it finds plugged in: identity, and which driver (if any) can configure it. No host I/O."
keywords = ["hid", "usb", "peripherals", "detection", "catalog"]
categories = ["hardware-support"]

[dependencies]
openlogi-device-registry = { path = "../openlogi-device-registry", version = "0.8.1" }
openlogi-streamdeck = { path = "../openlogi-streamdeck", version = "0.8.1" }
openlogi-via = { path = "../openlogi-via", version = "0.8.1" }

[lints]
workspace = true
