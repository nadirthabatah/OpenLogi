[package]
name = "roadie-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OpenRoadie Actions Ring overlay — the cursor-centred radial menu, a pure IPC client of the agent."
# Distributed as a login-item helper inside the bundled .app; never published.
publish = false

[[bin]]
name = "roadie-overlay"
path = "src/main.rs"

[dependencies]
roadie-core = { path = "../roadie-core" }
roadie-hook = { path = "../roadie-hook" }
roadie-ipc = { path = "../roadie-ipc" }
roadie-ui = { path = "../roadie-ui" }
anyhow = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
rust-i18n = "4"
succession = "0.2"
tarpc = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Held at the version Cargo.lock already has for gpui's own build-dependency;
# bumping it independently would move the pinned gpui rev.
[build-dependencies]
embed-resource = "3.0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# CGGetActiveDisplayList/CGDisplayBounds: placing the ring on the cursor's
# display needs global display bounds, which GPUI's display API doesn't expose
# (its bounds are display-relative). C FFI, so core-graphics.
core-graphics = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSWindow", "NSEvent", "block2"] }
# NSEvent global-monitor handlers are ObjC blocks (click-away dismissal).
block2 = { workspace = true }

[lints]
workspace = true
