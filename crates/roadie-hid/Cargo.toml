[package]
name = "roadie-hid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HID++ device discovery for OpenRoadie, wrapping the hidpp crate over async-hid."
keywords = ["logitech", "hidpp", "hid", "mouse", "async"]
categories = ["hardware-support", "asynchronous"]
readme = "README.md"

[dependencies]
roadie-core = { path = "../roadie-core", version = "0.9.0" }
hidpp = { workspace = true }
async-hid = { workspace = true }
tokio = { workspace = true }
futures-lite = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-concurrency = "7"
serde_json.workspace = true
atomic-write-file = { workspace = true }
roadie-device = { version = "0.9.0", path = "../roadie-device" }
roadie-catalog = { version = "0.9.0", path = "../roadie-catalog" }
roadie-streamdeck = { version = "0.9.0", path = "../roadie-streamdeck" }
roadie-keylight = { version = "0.9.0", path = "../roadie-keylight", default-features = false }
roadie-via = { version = "0.9.0", path = "../roadie-via" }

# Native Win32 HID report writes (windows_hid.rs) — a fallback for async-hid's
# write path on Windows, plus the composite short/long endpoint handling in
# transport.rs.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    # CreateFileW's signature references PSECURITY_ATTRIBUTES, so it is only
    # exposed when Win32_Security is also enabled.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # WriteFile's signature references OVERLAPPED, so windows-sys 0.61.2 gates
    # it behind Win32_System_IO as well.
    "Win32_System_IO",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-kit = { workspace = true, features = ["std", "hidsystem"] }

[lints]
workspace = true

[dev-dependencies]
# Exercising the full render -> frame -> transport path.
roadie-streamdeck = { path = "../roadie-streamdeck", features = ["render"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tempfile = "3"
# `start_paused`, so the read-timeout test proves the timeout without a test
# suite that actually waits for it. Same feature, same reason, as
# roadie-agent-core.
tokio = { workspace = true, features = ["test-util"] }
